<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111536">
  <meta name="description" content="Homepage pribadi Adit — ruang kecil untuk ide, karya, dan hal-hal yang sedang dibuat.">
  <title>Adit — ruang personal</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --ink: #f6f3ee;
      --muted: #a4a4ad;
      --accent: #d8ff72;
      --line: rgba(255, 255, 255, .12);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 76% 48%, rgba(73, 73, 102, .25), transparent 38%),
        radial-gradient(ellipse at 11% 95%, rgba(104, 123, 62, .13), transparent 34%),
        #10131c;
    }

    button, a { font: inherit; }
    button { color: inherit; }

    .page {
      position: relative;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      padding: 112px 8vw 54px;
      isolation: isolate;
    }

    .page::before {
      position: absolute;
      z-index: -1;
      inset: 0;
      background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 72px 72px;
      content: "";
      mask-image: linear-gradient(to bottom, transparent, black 30%, black 78%, transparent);
      pointer-events: none;
    }

    .layout {
      display: grid;
      width: min(1100px, 100%);
      grid-template-columns: 1.08fr .92fr;
      align-items: center;
      gap: clamp(48px, 8vw, 112px);
    }

    .intro { position: relative; z-index: 1; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 25px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 16px rgba(216, 255, 114, .7);
      content: "";
    }

    h1 {
      max-width: 650px;
      margin: 0;
      font-size: clamp(54px, 7.3vw, 96px);
      font-weight: 550;
      letter-spacing: -.075em;
      line-height: .98;
    }

    h1 span {
      color: var(--accent);
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-style: italic;
    }

    .copy {
      max-width: 460px;
      min-height: 92px;
      margin: 28px 0 0;
      color: #b8b8c1;
      font-size: clamp(15px, 1.45vw, 17px);
      line-height: 1.8;
    }

    .copy strong { color: var(--ink); font-weight: 550; }

    .visual {
      position: relative;
      width: min(100%, 390px);
      justify-self: end;
      aspect-ratio: .83;
    }

    .visual::before {
      position: absolute;
      inset: 12% -9% -7% 13%;
      border: 1px solid rgba(216, 255, 114, .27);
      border-radius: 48% 48% 22px 22px;
      content: "";
      transform: rotate(5deg);
    }

    .portrait {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 48% 48% 22px 22px;
      background: linear-gradient(145deg, #7f847a, #3e4440 56%, #1f232d);
      box-shadow: 0 30px 90px rgba(0,0,0,.38);
    }

    .portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 38%;
      opacity: .88;
      transition: opacity .25s ease, transform .6s ease;
    }

    .portrait:hover img { transform: scale(1.035); }

    .portrait::after {
      position: absolute;
      inset: 35% 0 0;
      background: linear-gradient(transparent, rgba(12, 14, 19, .74));
      content: "";
      pointer-events: none;
    }

    .image-label {
      position: absolute;
      z-index: 1;
      right: 23px;
      bottom: 22px;
      left: 23px;
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 10px;
    }

    .image-label p { margin: 0; }
    .image-label .name { font-size: 17px; font-weight: 600; }
    .image-label .role { margin-top: 5px; color: #d1d0d3; font-size: 12px; }

    .change-image {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 7px;
      padding: 9px 11px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 999px;
      color: white;
      background: rgba(16,19,28,.55);
      font-size: 11px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background .2s ease;
    }

    .change-image:hover { background: rgba(16,19,28,.85); }
    .change-image svg { width: 13px; height: 13px; }
    #image-input { position: absolute; width: 1px; height: 1px; opacity: 0; }

    .floating-note {
      position: absolute;
      top: 13%;
      right: -17%;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 12px 15px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(25, 28, 38, .83);
      box-shadow: 0 12px 35px rgba(0,0,0,.2);
      color: #d8d8de;
      font-size: 11px;
      backdrop-filter: blur(12px);
    }

    .floating-note span { color: var(--accent); font-size: 16px; }

    .navigation {
      position: fixed;
      z-index: 5;
      top: 25px;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 999px;
      background: rgba(28, 30, 39, .78);
      box-shadow: 0 12px 38px rgba(0,0,0,.24);
      transform: translateX(-50%);
      backdrop-filter: blur(18px);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .navigation button {
      min-height: 39px;
      padding: 0 16px;
      border: 0;
      border-radius: 999px;
      color: #a6a6b0;
      background: transparent;
      font-size: 12px;
      cursor: pointer;
      transition: color .2s ease, background .2s ease;
    }

    .navigation button:hover { color: white; }
    .navigation button[aria-selected="true"] { color: #10131c; background: var(--accent); font-weight: 700; }
    .status {
      position: fixed;
      right: 28px;
      bottom: 25px;
      color: #777984;
      font-size: 11px;
      letter-spacing: .05em;
    }

    .status::before {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 8px;
      border-radius: 50%;
      background: var(--accent);
      content: "";
      vertical-align: 1px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 760px) {
      body { overflow: auto; }
      .page { min-height: 100svh; padding: 110px 7vw 70px; }
      .layout { width: min(520px, 100%); grid-template-columns: 1fr; gap: 38px; }
      h1 { font-size: clamp(54px, 13vw, 76px); }
      .copy { min-height: 0; margin-top: 20px; }
      .visual { width: min(72%, 300px); justify-self: center; margin: 0 10% 22px 0; }
      .floating-note { right: -20%; }
      .status { right: 18px; bottom: 15px; }
      .navigation { top: 14px; max-width: calc(100vw - 24px); gap: 0; padding: 5px; }
      .navigation button { min-height: 37px; padding: 0 12px; font-size: 11px; }
    }

    @media (max-width: 390px) {
      .navigation button { padding: 0 9px; }
      .visual { width: 76%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }

    :root {
      color-scheme: light;
      --ink: #17171a;
      --muted: #77777f;
      --accent: #27272b;
      --line: rgba(22, 22, 26, .14);
    }

    body {
      display: flow-root;
      overflow: hidden;
      color: var(--ink);
      background: linear-gradient(rgba(12, 13, 22, .35), rgba(12, 13, 22, .58)), url("download.jpg") center 48% / cover fixed;
    }

    .page {
      width: min(1400px, calc(100% - 64px));
      min-height: min(820px, calc(100svh - 36px));
      margin: 18px auto;
      padding: 88px clamp(32px, 7vw, 100px) 24px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .68);
      border-radius: 14px;
      background: rgba(250, 250, 252, .96);
      box-shadow: 0 24px 100px rgba(7, 9, 28, .28);
    }

    .page::before { display: none; }

    .layout {
      width: min(1080px, 100%);
      grid-template-columns: 1.08fr .92fr;
      gap: clamp(48px, 9vw, 130px);
    }

    .eyebrow { color: #696970; }
    .eyebrow::before { background: #27272b; box-shadow: none; }

    h1 {
      font-family: Georgia, "Times New Roman", serif;

    }

    h1 span {
      color: #85858b;
      font-family: inherit;
      font-style: normal;
    }

    .copy {

    }

    .copy strong { color: #26262b; }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: clamp(20px, 3vw, 38px);
      margin-top: 34px;
    }

    .stat strong { display: block; font-family: Georgia, "Times New Roman", serif; font-size: 25px; font-weight: 500; }
    .stat span { display: block; margin-top: 4px; color: #707078; font-size: 10px; }

      width: min(100%, 370px);
      aspect-ratio: .9;
    }

    .visual::before { display: none; }
    .portrait { border: 0; border-radius: 13px; background: #293a72; box-shadow: 0 18px 42px rgba(21, 28, 67, .22); }
    .portrait img { object-position: center 50%; opacity: 1; }

    .image-label { right: 18px; bottom: 17px; left: 18px; }

    .change-image {

    }

    .change-image:hover { background: rgba(13, 15, 27, .75); }

    .floating-note {
      top: auto;
      right: -18px;
      top: 16%;
      bottom: auto;
      max-width: 190px;
      padding: 13px 15px;
      border-color: rgba(255,255,255,.18);
      border-radius: 9px;
      color: white;
      background: rgba(24, 25, 34, .82);
    }

    .floating-note span { color: #f6d276; }

    .navigation {
      top: 43px;
      left: 50%;
      gap: 13px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      transform: translateX(-50%);
      backdrop-filter: none;
    }

    .navigation .brand {
      margin-right: 13px;
      color: #1c1c20;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -.04em;
      white-space: nowrap;
    }

    .navigation .brand-mark { margin-right: 5px; font-size: 18px; }
    .navigation button {
      min-height: 34px;
      padding: 0 9px;
      border-radius: 6px;
      color: #38383e;
      font-size: 11px;
    }

    .navigation button:hover { color: #000; }
    .navigation button[aria-selected="true"] { color: #17171a; background: transparent; font-weight: 750; }

    .proof-row {
      display: grid;
      width: min(1080px, 100%);
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 20px;
      margin: 20px auto 0;
      padding-top: 14px;
      border-top: 1px solid rgba(25, 25, 30, .11);
    }

    .proof-row p { margin: 0; color: #77777f; font-size: 10px; }
    .proof-list { display: flex; flex-wrap: wrap; justify-content: end; gap: 18px; color: #35353b; font-size: 11px; font-weight: 650; }
    .status { position: absolute; right: 36px; bottom: 24px; color: #73737a; font-size: 10px; }
    .status::before { background: #428d63; }

    @media (max-width: 760px) {
      body { overflow: auto; }
      .page { width: calc(100% - 24px); min-height: calc(100svh - 24px); margin: 12px; padding: 100px 7vw 62px; }
      .layout { width: min(520px, 100%); grid-template-columns: 1fr; gap: 30px; }
      h1 { font-size: clamp(52px, 12vw, 72px); }
      .copy { margin-top: 16px; }
      .visual { width: min(76%, 310px); justify-self: center; margin: 0 8% 8px 0; }
      .floating-note { right: -18%; }
      .navigation { top: 30px; max-width: calc(100vw - 36px); gap: 2px; padding: 0; }
      .navigation .brand { display: none; }
      .navigation button { min-height: 36px; padding: 0 10px; font-size: 10px; }
      .proof-row { grid-template-columns: 1fr; margin-top: 16px; padding-top: 14px; }
      .proof-list { justify-content: start; gap: 12px; }
      .status { right: 22px; bottom: 25px; }
    }

    @media (max-width: 390px) {
      .navigation button { padding: 0 7px; font-size: 9px; }
      .visual { width: 79%; }
      .stats { gap: 20px; margin-top: 25px; }
    }

    :root {

      --ink: #f4f5ff;

    }

    .layout { width: min(1000px, 100%); gap: clamp(44px, 8vw, 100px); }
    .eyebrow { margin-bottom: 20px; color: #9c9eff; }
    .eyebrow::before { background: var(--accent); box-shadow: 0 0 14px rgba(114, 231, 255, .8); }

<body>
  <main class="page">
    <nav class="navigation" id="navigation" aria-label="Navigasi utama">
      <span class="brand"><span class="brand-mark">Rachni</span> Adithya Rachman</span>
      <button type="button" role="tab" id="tab-home" aria-selected="true" aria-controls="content-panel" data-tab="home">Beranda</button>
      <button type="button" role="tab" id="tab-about" aria-selected="false" aria-controls="content-panel" data-tab="about" tabindex="-1">Tentang</button>
      <button type="button" role="tab" id="tab-profile" aria-selected="false" aria-controls="content-panel" data-tab="profile" tabindex="-1">Biodata</button>
      <button type="button" role="tab" id="tab-contact" aria-selected="false" aria-controls="content-panel" data-tab="contact" tabindex="-1">Kontak</button>
    </nav>

    <section class="layout" aria-labelledby="headline">
      <div class="intro" id="content-panel" role="tabpanel" aria-labelledby="tab-home" tabindex="0">
        <p class="eyebrow" id="eyebrow">Mahasiswa Sistem Informasi</p>
        <h1 id="headline">Calon<br><span>Orang Sukses.</span></h1>
        <div class="copy" id="copy">Saya Adit Mahasiswa Sistem Informasi yang Ingin Berkembang Menjadi Seseorang yang Bisa Menginspirasi.</div>
      </div>

      <div class="visual">
        <div class="portrait" id="portrait">
          <img id="portrait-image" src="download.jpg" alt="Ilustrasi dunia fantasi dengan pepohonan bercahaya">
          <div class="image-label">
            <div>
              <p class="name">Rachni Adithya Rachman</p>
              <p class="role" id="image-role">Pria Modal Doa.</p>
            </div>
            <label class="change-image" for="image-input" title="Ganti gambar profil">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 5.5h2l1-1.5h5l1 1.5h2v7h-11v-7Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><circle cx="8" cy="8.8" r="2.2" stroke="currentColor" stroke-width="1.2"/></svg>
              Ganti foto
            </label>
            <input id="image-input" type="file" accept="image/*" aria-label="Pilih gambar profil baru">
          </div>
        </div>
      </div>
    </section>
    <p class="sr-only" id="announcement" aria-live="polite"></p>
  </main>

  <script>
    const navigation = document.querySelector("#navigation");
    const tabs = [...navigation.querySelectorAll('[role="tab"]')];
    const headline = document.querySelector("#headline");
    const eyebrow = document.querySelector("#eyebrow");
    const copy = document.querySelector("#copy");
    const panel = document.querySelector("#content-panel");
    const announcement = document.querySelector("#announcement");
    const imageInput = document.querySelector("#image-input");
    const portraitImage = document.querySelector("#portrait-image");

    const views = {
      home: {
        eyebrow: "Mahasiswa Sistem Informasi",
        title: "Calon<br><span>Orang Sukses.</span>",
        copy: "Pria dengan tekad menjadi orang yang bermanfaat bagi setiap <strong> punya karakter dan terasa hidup.</strong>",
      },
      about: {
        eyebrow: "Sedikit tentang saya",
        title: "Suka<br><span>Berbicara.</span>",
        copy: "Saya menyukai menjalin percakapan dengan orang lain karena dengan berbicara dengan orang lain kita bisa mengetahui pengalaman ataupun perspektif dari orang tersebut.",
      },
      profile: {
        eyebrow: "Profil singkat",
        title: "Kenali<br><span>Rachni Adithya Rachman</span>",
        copy: '<p class="bio-intro">Saya Adit, pribadi yang tertarik pada olahraga, teknologi, dan proses menciptakan hal baru.</p><dl class="bio-grid"><div class="bio-item"><dt>Tanggal lahir</dt><dd>09 Maret 2008</dd></div><div class="bio-item"><dt>Hobi</dt><dd>Olahraga</dd></div><div class="bio-item"><dt>Minat</dt><dd>Game &amp; Coding</dd></div><div class="bio-item"><dt>Domisili</dt><dd>Pontianak</dd></div></dl>',
        
      },
      contact: {
        eyebrow: "Hubungi saya",
        title: "Mari<br><span>terhubung.</span>",
        copy: "Punya ide menarik atau ingin berkenalan? Saya senang bertukar cerita. <strong>Semoga kita bisa terhubung.</strong>",
      }
    };

    function selectTab(tab, moveFocus) {
      const view = views[tab.dataset.tab];
      tabs.forEach((item) => {
        const active = item === tab;
        item.setAttribute("aria-selected", String(active));
        item.tabIndex = active ? 0 : -1;
      });
      panel.setAttribute("aria-labelledby", tab.id);
      eyebrow.textContent = view.eyebrow;
      headline.innerHTML = view.title;
      copy.innerHTML = view.copy;
      if (moveFocus) tab.focus();
    }

    tabs.forEach((tab, index) => {
      tab.addEventListener("click", () => selectTab(tab, false));
      tab.addEventListener("keydown", (event) => {
        let nextIndex = index;
        if (event.key === "ArrowRight") nextIndex = (index + 1) % tabs.length;
        else if (event.key === "ArrowLeft") nextIndex = (index - 1 + tabs.length) % tabs.length;
        else if (event.key === "Home") nextIndex = 0;
        else if (event.key === "End") nextIndex = tabs.length - 1;
        else return;
        event.preventDefault();
        selectTab(tabs[nextIndex], true);
      });
    });

    imageInput.addEventListener("change", () => {
      const file = imageInput.files && imageInput.files[0];
      if (!file) return;
      if (!file.type.startsWith("image/")) {
        announcement.textContent = "File yang dipilih bukan gambar. Silakan pilih file gambar.";
        imageInput.value = "";
        return;
      }
      const reader = new FileReader();
      reader.addEventListener("load", () => {
        if (typeof reader.result !== "string") {
          announcement.textContent = "Gambar tidak dapat dibaca. Silakan coba file lain.";
          return;
        }
        portraitImage.src = reader.result;
        announcement.textContent = `Foto profil diganti dengan ${file.name}.`;
      });
      reader.addEventListener("error", () => {
        announcement.textContent = "Gambar tidak dapat dibaca. Silakan coba file lain.";
      });
      reader.readAsDataURL(file);
    });

  </script>
